<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wynamp</title>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <span class="brand">WYNAMP</span>
        <div class="titlebar-meta">
          <span id="state-badge" class="badge">stopped</span>
          <span id="version" class="version"></span>
        </div>
      </header>

      <section class="display" id="display">
        <div class="display-row">
          <div class="marquee" id="marquee">
            <span id="track-title">No track — open some files</span>
          </div>
          <div class="clock">
            <span id="time-elapsed">0:00</span>
            <span class="clock-sep">/</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
        <div class="display-row display-sub">
          <span id="track-detail">—</span>
          <span id="track-tech">-- kbps · -- kHz</span>
        </div>
        <canvas id="viz" class="viz" width="512" height="96" hidden></canvas>
        <div class="seek" id="seek" title="Click to seek">
          <div class="seek-track">
            <div class="seek-fill" id="seek-fill"></div>
          </div>
          <div class="seek-knob" id="seek-knob"></div>
        </div>
      </section>

      <section class="controls">
        <div class="transport">
          <button class="btn" id="btn-prev" title="Previous (Z)">|◀</button>
          <button class="btn btn-play" id="btn-play" title="Play (X)">▶</button>
          <button class="btn" id="btn-pause" title="Pause (C)">▮▮</button>
          <button class="btn" id="btn-stop" title="Stop (V)">■</button>
          <button class="btn btn-next" id="btn-next" title="Next (B)">▶|</button>
        </div>

        <div class="toggles">
          <button class="chip" id="chip-shuffle" title="Shuffle">SHUF</button>
          <button class="chip" id="chip-repeat" title="Repeat: off / all / one">REP·OFF</button>
          <button class="chip" id="chip-eq" title="Equalizer panel">EQ</button>
          <button class="chip" id="chip-viz" title="Visualizer: off / spectrum / scope">VIZ·OFF</button>
          <button class="chip" id="chip-mini" title="Compact mini mode">MINI</button>
          <button class="chip" id="chip-theme" title="Skin: retro / modern">SKIN·RETRO</button>
          <button class="chip" id="chip-fav" title="Favorite the current track">♡</button>
          <button class="chip" id="chip-favpanel" title="Favorites">FAV</button>
          <button class="chip" id="chip-radio" title="Internet radio">RADIO</button>
          <button class="chip" id="chip-navi" title="Navidrome library">NAVI</button>
          <button class="chip" id="chip-settings" title="Servers & settings">⚙</button>
        </div>

        <div class="sliders">
          <label class="slider">
            <span>vol</span>
            <input type="range" id="volume" min="0" max="100" value="100" />
          </label>
          <label class="slider">
            <span>bal</span>
            <input type="range" id="balance" min="-100" max="100" value="0" />
          </label>
        </div>

        <button class="btn btn-open" id="btn-open" title="Open audio files">
          OPEN…
        </button>
        <button class="btn btn-open" id="btn-folder" title="Scan a folder into the queue and library">
          FOLDER…
        </button>
        <button class="btn btn-open" id="btn-save" title="Save queue as M3U/PLS">
          SAVE…
        </button>
        <button class="btn btn-open" id="btn-load" title="Load an M3U/PLS playlist">
          LOAD…
        </button>
      </section>

      <section class="eq-panel" id="eq-panel" hidden>
        <div class="eq-head">
          <button class="chip on" id="chip-eq-on" title="Engage/bypass the equalizer">
            EQ·ON
          </button>
          <label class="slider">
            <span>pre</span>
            <input type="range" id="eq-preamp" min="-12" max="12" step="0.5" value="0" />
          </label>
          <select id="eq-preset" class="preset" title="EQ preset"></select>
        </div>
        <div class="eq-bands" id="eq-bands"></div>
      </section>

      <section class="fav-panel" id="fav-panel" hidden>
        <div class="fav-head">
          <button class="chip on" data-fav-filter="all">ALL</button>
          <button class="chip" data-fav-filter="local">LOCAL</button>
          <button class="chip" data-fav-filter="navidrome">NAVI</button>
          <button class="chip" data-fav-filter="radio">RADIO</button>
          <span class="fav-spacer"></span>
          <button class="chip" id="fav-export" title="Export favorites as JSON">EXPORT…</button>
          <button class="chip" id="fav-import" title="Import favorites from JSON">IMPORT…</button>
        </div>
        <ul id="fav-list" class="queue-list fav-list"></ul>
      </section>

      <section class="fav-panel" id="radio-panel" hidden>
        <div class="fav-head">
          <input
            id="radio-name"
            class="radio-input"
            type="text"
            placeholder="Station name…"
          />
          <input
            id="radio-country"
            class="radio-input"
            type="text"
            placeholder="Country…"
          />
          <button class="chip on" id="radio-search">SEARCH</button>
          <span class="fav-spacer"></span>
        </div>
        <div class="fav-head">
          <input
            id="radio-url"
            class="radio-input wide"
            type="text"
            placeholder="…or paste a stream URL (http://…)"
          />
          <button class="chip" id="radio-add" title="Play a custom stream URL">PLAY URL</button>
        </div>
        <ul id="radio-list" class="queue-list fav-list"></ul>
      </section>

      <section class="fav-panel" id="settings-panel" hidden>
        <div class="fav-head">
          <input id="srv-id" class="radio-input" type="text" placeholder="id (e.g. home)" />
          <input id="srv-url" class="radio-input wide" type="text" placeholder="https://music.example.com" />
          <input id="srv-user" class="radio-input" type="text" placeholder="username" />
          <input id="srv-pass" class="radio-input" type="password" placeholder="password" />
          <button class="chip on" id="srv-add">ADD</button>
        </div>
        <ul id="srv-list" class="queue-list fav-list"></ul>
      </section>

      <section class="fav-panel" id="navi-panel" hidden>
        <div class="fav-head">
          <select id="navi-server" class="preset"></select>
          <button class="chip" id="navi-back" title="Back">←</button>
          <input id="navi-query" class="radio-input wide" type="text" placeholder="Search songs, albums, artists…" />
          <button class="chip on" id="navi-search">SEARCH</button>
        </div>
        <ul id="navi-list" class="queue-list fav-list"></ul>
      </section>

      <section class="queue">
        <ul id="queue-list" class="queue-list"></ul>
        <footer class="queue-hint">
          <button
            class="chip"
            id="btn-clear"
            title="Empty the queue (the library is kept)"
          >
            CLEAR
          </button>
          <span id="queue-summary">0 tracks · 0:00</span>
          <span
            >Drop files · ⌘-click select · ⌫ delete · drag to reorder ·
            Space = play/pause</span
          >
        </footer>
      </section>

      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
