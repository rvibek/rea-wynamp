[package]
name = "rea-wynamp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wynamp desktop application (Tauri 2)"
publish = false

[[bin]]
name = "wynamp"
path = "src/main.rs"

[dependencies]
rea-wynamp-core = { path = "../core" }
rea-wynamp-platform = { path = "../platform" }
rea-wynamp-radio = { path = "../radio" }
rea-wynamp-navidrome = { path = "../navidrome" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"
lofty = "0.25"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }
