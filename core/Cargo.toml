[package]
name = "rea-wynamp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core models, playback protocol, and shared errors for Wynamp"
publish = false

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
symphonia = { version = "0.6", features = [
    "mp3",
    "aac",
    "flac",
    "wav",
    "alac",
    "vorbis",
    "ogg",
    "isomp4",
    "aiff",
    "pcm",
] }
cpal = "0.18"
